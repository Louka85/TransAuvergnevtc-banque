<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferts - France Logistique Banking</title>
    <script>
        (function(){
            try {
                var t = localStorage.getItem('theme') || 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { /* ignore */ }
        })();
    </script>
    <link rel="stylesheet" href="styles-new.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="js/theme.js" defer></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <div class="logo">
                        <img src="assets/logosansfond.svg" alt="Auvergne Finances Logo" class="logo-img">
                    </div>
                    <div class="brand">
                        <h1>FL Bank</h1>
                        <p>France Logistique</p>
                    </div>
                </div>
            </div>
            <nav class="main-nav">
                <ul>
                    <li>
                        <a href="index.html">
                            <span class="nav-icon"><i class="ri-dashboard-line"></i></span>
                            Tableau de Bord
                        </a>
                    </li>
                    <li>
                        <a href="employes.html">
                            <span class="nav-icon"><i class="ri-team-line"></i></span>
                            Employés
                        </a>
                    </li>
                    <li class="active">
                        <a href="transferts.html">
                            <span class="nav-icon"><i class="ri-exchange-line"></i></span>
                            Transferts
                        </a>
                    </li>
                    <li>
                        <a href="paiements.html">
                            <span class="nav-icon"><i class="ri-bank-card-line"></i></span>
                            Paiements
                        </a>
                    </li>
                    <li>
                        <a href="fiches-paie.html">
                            <span class="nav-icon"><i class="ri-file-list-3-line"></i></span>
                            Fiches de Paie
                        </a>
                    </li>
                    <li>
                        <a href="rapports.html">
                            <span class="nav-icon"><i class="ri-line-chart-line"></i></span>
                            Rapports
                        </a>
                    </li>
                </ul>
            </nav>
            <footer class="sidebar-footer">
                <p>Version 1.0.0 - Virtuel</p>
            </footer>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="page-header">
                <h2>Transferts</h2>
                <div class="user-menu">
                    <div class="user-info">
                        <span class="user-name">Admin</span>
                    </div>
                    <button class="theme-toggle" aria-label="Toggle theme">
                        <i class="ri-sun-line light-icon"></i>
                        <i class="ri-moon-line dark-icon"></i>
                    </button>
                    <button class="btn-primary" onclick="document.getElementById('newTransferModal').style.display='block'">
                        <i class="ri-add-line"></i> Nouveau Transfert
                    </button>
                </div>
            </header>

            <!-- Transfers List -->
            <section class="transfers-section">
                <div class="filters">
                    <select class="filter-select">
                        <option value="all">Tous les transferts</option>
                        <option value="incoming">Transferts entrants</option>
                        <option value="outgoing">Transferts sortants</option>
                    </select>
                    <input type="date" class="filter-date" value="2025-10-31">
                </div>

                <table class="transfers-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>De</th>
                            <th>Vers</th>
                            <th>Montant</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="6" class="text-center">Aucun transfert disponible</td>
                        </tr>
                    </tbody>
                </table>

                <div class="pagination">
                    <button class="btn-outline">Précédent</button>
                    <span>Page 1 sur 5</span>
                    <button class="btn-outline">Suivant</button>
                </div>
            </section>

            <!-- New Transfer Modal -->
            <div id="newTransferModal" class="modal">
                <div class="modal-content">
                    <h2>Nouveau Transfert</h2>
                    <form id="newTransferForm">
                        <div class="form-group">
                            <label for="fromAccount">De</label>
                            <select id="fromAccount" name="fromAccount" required>
                                <option value="">Sélectionnez l'expéditeur</option>
                                <option value="1">Jean Dupont - Chauffeur</option>
                                <option value="2">Marie Martin - Gestionnaire</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="toAccount">Vers</label>
                            <select id="toAccount" name="toAccount" required>
                                <option value="">Sélectionnez le destinataire</option>
                                <option value="1">Jean Dupont - Chauffeur</option>
                                <option value="2">Marie Martin - Gestionnaire</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="amount">Montant (€)</label>
                            <input type="number" id="amount" name="amount" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" name="description" rows="3"></textarea>
                        </div>
                        <div class="modal-actions">
                            <button type="button" class="btn-secondary" onclick="document.getElementById('newTransferModal').style.display='none'">
                                Annuler
                            </button>
                            <button type="submit" class="btn-primary">Transférer</button>
                        </div>
                    </form>
                </div>
            </div>
            <footer class="main-footer">
                <p>Version 1.0.0 - Virtuel</p>
            </footer>
        </main>
    </div>
</body>
</html>
