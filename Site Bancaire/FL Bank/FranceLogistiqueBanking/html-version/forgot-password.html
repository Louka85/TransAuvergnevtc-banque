<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09E4A0">
    <title>Récupération de mot de passe - Auvergne Finance</title>
    <link rel="manifest" href="manifest.json">
    <script>
        (function(){
            try {
                var t = localStorage.getItem('theme') || 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { /* ignore */ }
        })();
    </script>
    <link rel="stylesheet" href="styles-new.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #09E4A0 0%, #076E52 100%);
            padding: 2rem;
        }

        .login-card {
            background: var(--card-background);
            border-radius: var(--border-radius-lg);
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: var(--primary-color);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
        }

        .login-header h1 {
            color: var(--primary-color);
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: var(--muted-text);
            font-size: 0.875rem;
        }

        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
            position: relative;
        }

        .step {
            flex: 1;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .step-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--border-color);
            color: var(--muted-text);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.5rem;
            font-weight: 600;
            transition: all var(--transition-quick);
        }

        .step.active .step-number {
            background: var(--primary-color);
            color: white;
        }

        .step.completed .step-number {
            background: var(--success-color);
            color: white;
        }

        .step-label {
            font-size: 0.75rem;
            color: var(--muted-text);
        }

        .step.active .step-label {
            color: var(--primary-color);
            font-weight: 600;
        }

        .form-step {
            display: none;
        }

        .form-step.active {
            display: block;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            color: var(--text-color);
            font-weight: 500;
            font-size: 0.875rem;
        }

        .form-group input {
            padding: 0.875rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius-md);
            background: var(--card-background);
            color: var(--text-color);
            font-size: 1rem;
            transition: all var(--transition-quick);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 90, 69, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-quick);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary:hover {
            background: #004a38;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 90, 69, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline {
            width: 100%;
            padding: 1rem;
            background: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            border-radius: var(--border-radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-quick);
            margin-top: 1rem;
        }

        .btn-outline:hover {
            background: rgba(0, 90, 69, 0.05);
        }

        .error-message, .success-message {
            padding: 0.875rem;
            border-radius: var(--border-radius-md);
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message {
            background: rgba(229, 62, 62, 0.1);
            color: #e53e3e;
            border: 1px solid rgba(229, 62, 62, 0.2);
        }

        .success-message {
            background: rgba(76, 175, 80, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(76, 175, 80, 0.2);
        }

        .error-message.show, .success-message.show {
            display: block;
        }

        .code-display {
            background: rgba(0, 90, 69, 0.1);
            border: 2px dashed var(--primary-color);
            border-radius: var(--border-radius-md);
            padding: 1.5rem;
            text-align: center;
            margin: 1.5rem 0;
        }

        .code-display .code {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="ri-lock-password-line"></i>
                </div>
                <h1>Récupération de mot de passe</h1>
                <p>Suivez les étapes pour réinitialiser votre code d'accès</p>
            </div>

            <div class="step-indicator">
                <div class="step active" id="step1">
                    <div class="step-number">1</div>
                    <div class="step-label">Identifiant</div>
                </div>
                <div class="step" id="step2">
                    <div class="step-number">2</div>
                    <div class="step-label">Code provisoire</div>
                </div>
                <div class="step" id="step3">
                    <div class="step-number">3</div>
                    <div class="step-label">Nouveau mot de passe</div>
                </div>
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <!-- Étape 1: Demander le code -->
            <div class="form-step active" id="step1Form">
                <form id="requestCodeForm">
                    <div class="form-group">
                        <label for="identifier">
                            <i class="ri-user-line"></i> Identifiants (ID employé, nom d'utilisateur ou email)
                        </label>
                        <input type="text" id="identifier" name="identifier" placeholder="FL001, username ou email" required>
                    </div>
                    <button type="submit" class="btn-primary" id="requestBtn">
                        <i class="ri-mail-send-line"></i>
                        Envoyer le code provisoire
                    </button>
                </form>
            </div>

            <!-- Étape 2: Entrer le code -->
            <div class="form-step" id="step2Form">
                <div class="code-display" id="codeDisplay" style="display: none;">
                    <p style="margin-bottom: 0.5rem; color: var(--muted-text); font-size: 0.875rem;">Code provisoire généré :</p>
                    <div class="code" id="tempCode"></div>
                    <p style="margin-top: 0.5rem; color: var(--muted-text); font-size: 0.75rem;">Ce code expire dans 10 minutes</p>
                </div>
                <form id="verifyCodeForm">
                    <div class="form-group">
                        <label for="tempCodeInput">
                            <i class="ri-key-line"></i> Code provisoire
                        </label>
                        <input type="text" id="tempCodeInput" name="tempCode" placeholder="Entrez le code reçu" required>
                    </div>
                    <button type="submit" class="btn-primary" id="verifyBtn">
                        <i class="ri-check-line"></i>
                        Vérifier le code
                    </button>
                </form>
            </div>

            <!-- Étape 3: Nouveau mot de passe -->
            <div class="form-step" id="step3Form">
                <form id="newPasswordForm">
                    <div class="form-group">
                        <label for="newPassword">
                            <i class="ri-lock-password-line"></i> Nouveau mot de passe
                        </label>
                        <input type="password" id="newPassword" name="newPassword" placeholder="Minimum 6 caractères" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">
                            <i class="ri-lock-password-line"></i> Confirmer le mot de passe
                        </label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Répétez le mot de passe" required minlength="6">
                    </div>
                    <button type="submit" class="btn-primary" id="saveBtn">
                        <i class="ri-save-line"></i>
                        Enregistrer le nouveau mot de passe
                    </button>
                </form>
            </div>

            <div class="back-link">
                <a href="login.html">
                    <i class="ri-arrow-left-line"></i> Retour à la connexion
                </a>
            </div>
        </div>
    </div>

    <script src="js/app-data.js"></script>
    <script src="js/auth.js"></script>
    <script>
        let currentStep = 1;
        let currentIdentifier = '';

        function showStep(step) {
            // Masquer tous les formulaires
            document.querySelectorAll('.form-step').forEach(f => f.classList.remove('active'));
            document.querySelectorAll('.step').forEach(s => {
                s.classList.remove('active', 'completed');
            });

            // Afficher le formulaire correspondant
            if (step === 1) {
                document.getElementById('step1Form').classList.add('active');
                document.getElementById('step1').classList.add('active');
            } else if (step === 2) {
                document.getElementById('step2Form').classList.add('active');
                document.getElementById('step1').classList.add('completed');
                document.getElementById('step2').classList.add('active');
            } else if (step === 3) {
                document.getElementById('step3Form').classList.add('active');
                document.getElementById('step1').classList.add('completed');
                document.getElementById('step2').classList.add('completed');
                document.getElementById('step3').classList.add('active');
            }

            currentStep = step;
        }

        function showMessage(element, message, isError = false) {
            const errorMsg = document.getElementById('errorMessage');
            const successMsg = document.getElementById('successMessage');
            
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');

            if (isError) {
                errorMsg.textContent = message;
                errorMsg.classList.add('show');
            } else {
                successMsg.textContent = message;
                successMsg.classList.add('show');
            }
        }

        // Étape 1: Demander le code
        document.getElementById('requestCodeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const identifier = document.getElementById('identifier').value.trim();
            const btn = document.getElementById('requestBtn');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="ri-loader-4-line"></i> Envoi en cours...';

            try {
                const result = AuthSystem.requestPasswordReset(identifier);
                
                if (result.success) {
                    currentIdentifier = identifier;
                    // Afficher le code pour la démo (en production, il serait envoyé par email)
                    document.getElementById('tempCode').textContent = result.code;
                    document.getElementById('codeDisplay').style.display = 'block';
                    
                    showMessage(null, result.message, false);
                    setTimeout(() => {
                        showStep(2);
                    }, 2000);
                } else {
                    showMessage(null, result.message, true);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="ri-mail-send-line"></i> Envoyer le code provisoire';
                }
            } catch (error) {
                showMessage(null, 'Erreur: ' + error.message, true);
                btn.disabled = false;
                btn.innerHTML = '<i class="ri-mail-send-line"></i> Envoyer le code provisoire';
            }
        });

        // Étape 2: Vérifier le code
        document.getElementById('verifyCodeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('tempCodeInput').value.trim();
            const btn = document.getElementById('verifyBtn');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="ri-loader-4-line"></i> Vérification...';

            // Simuler une vérification (le vrai code est vérifié à l'étape 3)
            setTimeout(() => {
                showMessage(null, 'Code vérifié !', false);
                showStep(3);
                btn.disabled = false;
                btn.innerHTML = '<i class="ri-check-line"></i> Vérifier le code';
            }, 1000);
        });

        // Étape 3: Nouveau mot de passe
        document.getElementById('newPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const code = document.getElementById('tempCodeInput').value.trim();
            const btn = document.getElementById('saveBtn');

            if (newPassword !== confirmPassword) {
                showMessage(null, 'Les mots de passe ne correspondent pas.', true);
                return;
            }

            if (newPassword.length < 6) {
                showMessage(null, 'Le mot de passe doit contenir au moins 6 caractères.', true);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="ri-loader-4-line"></i> Enregistrement...';

            try {
                const result = AuthSystem.verifyTempCode(currentIdentifier, code, newPassword);
                
                if (result.success) {
                    showMessage(null, result.message, false);
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showMessage(null, result.message, true);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="ri-save-line"></i> Enregistrer le nouveau mot de passe';
                }
            } catch (error) {
                showMessage(null, 'Erreur: ' + error.message, true);
                btn.disabled = false;
                btn.innerHTML = '<i class="ri-save-line"></i> Enregistrer le nouveau mot de passe';
            }
        });
    </script>
</body>
</html>
