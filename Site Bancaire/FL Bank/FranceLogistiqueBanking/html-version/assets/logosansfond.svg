<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Key handle curve -->
  <path d="M 50 40 Q 30 40 30 60 Q 30 80 50 80" 
        stroke="#076E52" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- T shape - vertical bar -->
  <rect x="85" y="30" width="30" height="120" fill="#09E4A0" rx="5"/>
  
  <!-- T shape - horizontal bar -->
  <rect x="50" y="30" width="100" height="25" fill="#09E4A0" rx="5"/>
  
  <!-- Key teeth -->
  <g fill="#09E4A0">
    <rect x="130" y="100" width="15" height="12" rx="2"/>
    <rect x="150" y="105" width="12" height="10" rx="2"/>
    <rect x="130" y="125" width="18" height="12" rx="2"/>
  </g>
  
  <!-- Key circle handle -->
  <circle cx="45" cy="60" r="18" fill="none" stroke="#076E52" stroke-width="6"/>
  
  <!-- Highlight/shine effect -->
  <ellipse cx="75" cy="50" rx="15" ry="12" fill="rgba(255,255,255,0.3)"/>
</svg>